[project]
name = "cravingcrave"
version = "0.9.9"
description = "CETUS — clinician-supervised, non-VR Cue Exposure Therapy (CET-USCS) desktop app"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.1.1",
]

[project.optional-dependencies]
# Pinned to lower bounds known good with this project for reproducible dev/CI builds.
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.10", "ruff>=0.6"]

[project.scripts]
# NOTE: the console-script and package id remain `cravingcrave` (the product/brand
# is "CETUS"; product name != package id, kept stable to avoid churn/DB breakage).
cetus = "cravingcrave.app:main"
cravingcrave = "cravingcrave.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cravingcrave*"]

[tool.setuptools.package-data]
cravingcrave = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Dev/QA helpers and offline tooling are not part of the shipped app.
extend-exclude = [".venv", "dist", "build", "_backup"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "E741",  # ambiguous var names (l/O) appear in short local math helpers
    "E702",  # compact `a; b` statements are an intentional style in the UI layout code
    "UP042", # keep `class X(str, Enum)` for stable .value string serialization to SQLite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

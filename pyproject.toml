[project]
name = "cravingcrave"
version = "0.1.0"
description = "CETUS — clinician-supervised, non-VR Cue Exposure Therapy (CET-USCS) desktop app"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[project.scripts]
cravingcrave = "cravingcrave.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cravingcrave*"]

[tool.setuptools.package-data]
cravingcrave = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

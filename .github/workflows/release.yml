name: Release

# Build per-OS installers and attach them to a GitHub Release when a v* tag is pushed.
# PyInstaller cannot cross-compile, so each OS builds on its own runner.
# Builds are UNSIGNED (no Apple/Windows certificate) — see packaging/README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # allow manual runs for testing

permissions:
  contents: write         # needed to create/update the Release and upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Derive version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller --noconfirm cravingcrave.spec

      # ---- Windows: Inno Setup installer + portable exe ----
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=%APP_VERSION% packaging\windows\cetus.iss || exit /b 1
          copy dist\CETUS.exe dist\CETUS-%APP_VERSION%-portable.exe

      # ---- macOS: .dmg from the .app bundle ----
      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: bash packaging/macos/make_dmg.sh "$APP_VERSION"

      # ---- Linux: AppImage ----
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          sudo curl -L -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # AppImages need FUSE or --appimage-extract-and-run on CI runners.
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash packaging/linux/make_appimage.sh "$APP_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cetus-${{ runner.os }}
          path: |
            packaging/windows/Output/*.exe
            dist/*-portable.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
